<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes · MyShopper</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-elev: #12151d;
    --bg-elev-2: #171b25;
    --line: #232838;
    --line-soft: #1b1f2b;
    --text: #e7ebf3;
    --text-dim: #9aa4b8;
    --text-faint: #5f6a80;
    --accent: #6c8cff;
    --accent-2: #9a7bff;
    --user-bubble: linear-gradient(135deg, #4f6bff 0%, #6d5cff 100%);
    --hermes-bubble: #1b2030;
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* lifecycle badge colors */
    --st-proposed: #7c86a0;
    --st-accepted: #4aa3ff;
    --st-in_progress: #f0b52a;
    --st-completed: #34d399;
    --st-failed: #ff5d6c;
    --st-input_required: #b06bff;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(108,140,255,0.10), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(154,123,255,0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    grid-template-rows: auto 1fr;
    height: 100vh;
    max-width: 1500px;
    margin: 0 auto;
  }

  /* ---------- Shared panel chrome ---------- */
  .panel { display: flex; flex-direction: column; min-height: 0; }
  .panel--chat { border-right: 1px solid var(--line); }

  .panel-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    flex: none;
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; color: #fff; font-size: 17px;
    box-shadow: 0 4px 16px rgba(108,140,255,0.35);
  }
  .brand-title { font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
  .brand-sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .head-spacer { flex: 1; }
  .status-dot {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-dim);
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg-elev);
  }
  .status-dot i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint);
    transition: background .3s, box-shadow .3s;
  }
  .status-dot.live i { background: var(--st-completed); box-shadow: 0 0 0 3px rgba(52,211,153,0.18); }
  .status-dot.busy i { background: var(--st-in_progress); box-shadow: 0 0 0 3px rgba(240,181,42,0.18); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ---------- Agent liveness row ---------- */
  .liveness-row {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 22px; border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
  }
  .liveness-label {
    font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
    color: var(--text-faint); margin-right: 2px;
  }
  .liveness-item {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-dim);
  }
  .liveness-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-faint); flex: none;
    transition: background .3s, box-shadow .3s;
  }
  .liveness-item.healthy .dot { background: var(--st-completed); box-shadow: 0 0 0 2px rgba(52,211,153,0.18); }
  .liveness-item.dead .dot { background: var(--st-failed); box-shadow: 0 0 0 2px rgba(255,93,108,0.18); }
  .liveness-item.unknown .dot { background: var(--text-faint); }

  /* ---------- Chat ---------- */
  .chat-scroll {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 26px 22px 8px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 11px; max-width: 82%; animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    margin-top: 2px;
  }
  .msg .bubble {
    padding: 12px 15px; border-radius: 14px; line-height: 1.5; font-size: 14.5px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.hermes .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; }
  .msg.hermes .bubble { background: var(--hermes-bubble); border: 1px solid var(--line); border-top-left-radius: 5px; }
  /* Lightweight markdown rendering for Hermes/assistant text only (see mdToHtml). */
  .msg.hermes .bubble p { margin: 0 0 10px; }
  .msg.hermes .bubble p:last-child { margin-bottom: 0; }
  .msg.hermes .bubble h1, .msg.hermes .bubble h2, .msg.hermes .bubble h3,
  .msg.hermes .bubble h4, .msg.hermes .bubble h5, .msg.hermes .bubble h6 {
    margin: 14px 0 8px; line-height: 1.3; font-weight: 700; color: var(--text);
  }
  .msg.hermes .bubble h1:first-child, .msg.hermes .bubble h2:first-child,
  .msg.hermes .bubble h3:first-child, .msg.hermes .bubble h4:first-child {
    margin-top: 0;
  }
  .msg.hermes .bubble h1 { font-size: 17px; }
  .msg.hermes .bubble h2 { font-size: 15.5px; }
  .msg.hermes .bubble h3 { font-size: 14.5px; }
  .msg.hermes .bubble h4, .msg.hermes .bubble h5, .msg.hermes .bubble h6 { font-size: 14px; }
  .msg.hermes .bubble ul, .msg.hermes .bubble ol { margin: 6px 0 10px; padding-left: 20px; }
  .msg.hermes .bubble li { margin-bottom: 4px; }
  .msg.hermes .bubble li:last-child { margin-bottom: 0; }
  .msg.hermes .bubble strong { font-weight: 700; color: var(--text); }
  .msg.hermes .bubble em { font-style: italic; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .avatar { background: #232838; color: var(--text-dim); }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-top-right-radius: 5px; box-shadow: 0 6px 18px rgba(79,107,255,0.28); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay: .2s; } .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25; transform: translateY(0);} 40%{opacity:1; transform: translateY(-3px);} }

  /* HITL approval card */
  .approval {
    margin-top: 8px; border: 1px solid var(--st-input_required);
    border-radius: 12px; padding: 13px 14px; background: rgba(176,107,255,0.08);
  }
  .approval .a-title { font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--st-input_required); margin-bottom: 6px; }
  .approval .a-body { font-size: 13.5px; color: var(--text); line-height: 1.45; }
  .approval .a-btns { display: flex; gap: 9px; margin-top: 12px; }
  .btn {
    font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 9px; padding: 8px 16px; border: 1px solid transparent; transition: transform .08s, filter .15s, opacity .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn.approve { background: linear-gradient(135deg,#2fbf87,#22a06b); color: #fff; }
  .btn.decline { background: var(--bg-elev-2); color: var(--text-dim); border-color: var(--line); }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .5; cursor: default; filter: none; transform: none; }
  .approval.resolved { opacity: .7; }
  .approval .a-result { margin-top: 10px; font-size: 12.5px; font-weight: 600; }

  /* Composer */
  .composer {
    flex: none; padding: 14px 18px 18px; border-top: 1px solid var(--line);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.15));
  }
  .composer-inner {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px;
    padding: 8px 8px 8px 15px; transition: border-color .15s, box-shadow .15s;
  }
  .composer-inner:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,140,255,0.16); }
  #input {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font-family: var(--sans); font-size: 14.5px; line-height: 1.45;
    max-height: 130px; padding: 6px 0;
  }
  #input::placeholder { color: var(--text-faint); }
  #send {
    flex: none; width: 40px; height: 40px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    display: grid; place-items: center; transition: filter .15s, opacity .15s;
  }
  #send:hover { filter: brightness(1.1); }
  #send:disabled { opacity: .45; cursor: default; }
  .hint { font-size: 11px; color: var(--text-faint); margin: 8px 4px 0; text-align: center; }

  /* ---------- Trace ---------- */
  .panel--trace { background: var(--bg-elev); }
  .trace-metrics {
    display: flex; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft);
    flex: none;
  }
  .metric {
    flex: 1; background: var(--bg-elev-2); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 9px 12px;
  }
  .metric .m-label { font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--text-faint); }
  .metric .m-value { font-family: var(--mono); font-size: 18px; font-weight: 600; margin-top: 3px; color: var(--text); }
  .metric .m-value small { font-size: 12px; color: var(--text-dim); font-weight: 500; }

  .trace-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 24px; }
  .trace-empty { color: var(--text-faint); font-size: 13px; text-align: center; margin-top: 60px; line-height: 1.6; }
  .trace-empty .big { font-size: 26px; margin-bottom: 8px; opacity: .5; }

  /* One section per customer message: the message that triggered the run,
     followed by its own indented request/response tree underneath. */
  .trun { margin-bottom: 24px; }
  .trun:last-child { margin-bottom: 4px; }
  .trun-head {
    display: flex; align-items: flex-start; gap: 8px;
    margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .trun-quote { flex: none; color: var(--accent); font-size: 15px; line-height: 1.2; opacity: .8; }
  .trun-body { min-width: 0; }
  .trun-label {
    font-size: 10px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 3px;
  }
  .trun-msg { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.4; word-wrap: break-word; }

  .timeline { position: relative; padding-left: 20px; }
  .timeline::before {
    content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(180deg, var(--line), transparent);
  }
  .tnode {
    position: relative; margin-bottom: 12px; animation: rise .25s ease both;
  }
  .tnode::before {
    content: ""; position: absolute; left: -18px; top: 15px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--dot, var(--text-faint));
    box-shadow: 0 0 0 3px var(--bg-elev);
  }
  .tcard {
    background: var(--bg-elev-2); border: 1px solid var(--line-soft); border-radius: 11px;
    padding: 11px 13px; font-family: var(--mono);
  }
  .tcard-top {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    cursor: pointer; border-radius: 6px; outline: none;
  }
  .tcard-top:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .tcard-top:hover .route { color: var(--accent); }
  .chev {
    display: inline-flex; align-items: center; justify-content: center;
    width: 12px; flex: none; color: var(--text-faint); font-size: 9px;
    transition: transform .15s ease, color .15s ease;
  }
  .chev.open { transform: rotate(90deg); color: var(--text-dim); }
  .route { font-size: 12.5px; color: var(--text); font-weight: 600; transition: color .15s ease; }
  .route .arrow { color: var(--text-faint); margin: 0 3px; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 6px; color: #05070c;
  }
  .tcard .intent {
    display: inline-block; margin-top: 8px; font-size: 11.5px; color: var(--accent);
    background: rgba(108,140,255,0.1); border: 1px solid rgba(108,140,255,0.22);
    padding: 2px 8px; border-radius: 6px;
  }
  .tmetrics {
    display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
    font-size: 11px; color: var(--text-dim);
  }
  .tmetrics span b { color: var(--text); font-weight: 600; }
  .tmetrics .none { color: var(--text-faint); }
  .tmeta {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-top: 8px; font-size: 10.5px; color: var(--text-faint);
  }
  .tmeta .step { color: var(--text-dim); font-weight: 700; }
  .tmeta .sep { opacity: .45; }
  .tmeta .offset { color: var(--accent); }

  /* ---------- Hierarchy: per-agent request/response exchange ---------- */
  /* A request/response pair, indented one level under the base (framing) rows. */
  .texchange {
    margin: 0 0 12px 24px;
    padding-left: 14px;
    border-left: 2px solid var(--line-soft);
    animation: rise .25s ease both;
  }
  .texchange--orphan { border-left-color: var(--st-failed); }
  .thop { margin-bottom: 8px; }
  .thop:last-child { margin-bottom: 0; }
  /* The response nests under its request via extra indent + its own left border,
     so the call/return relationship reads at a glance. */
  .thop--response {
    margin-left: 16px;
    padding-left: 12px;
    border-left: 2px solid var(--line-soft);
  }

  /* ---------- Drill-down detail (expand on row click) ---------- */
  .tdetail {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--line-soft);
  }
  .tdetail-fields {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
    font-size: 11px; margin-bottom: 8px;
  }
  .tdetail-key { color: var(--text-faint); text-transform: uppercase; letter-spacing: .4px; }
  .tdetail-val { color: var(--text); word-break: break-all; }
  .tdetail-json {
    margin: 0; padding: 9px 11px; background: var(--bg);
    border: 1px solid var(--line-soft); border-radius: 8px;
    font-size: 11px; line-height: 1.5; color: var(--text-dim);
    max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }

  /* scrollbars */
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: #262c3c; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #333a4d; background-clip: content-box; }

  /* responsive */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: 100vh; }
    .panel--trace { max-height: 42vh; border-top: 1px solid var(--line); }
    .panel--chat { border-right: none; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Agent liveness: unobtrusive status row above both panels, polled from /agents. -->
  <div class="liveness-row" id="liveness-row">
    <span class="liveness-label">Agents</span>
  </div>

  <!-- LEFT: Chat -->
  <section class="panel panel--chat">
    <div class="panel-head">
      <div class="brand-mark">H</div>
      <div>
        <div class="brand-title">Hermes</div>
        <div class="brand-sub">MyShopper concierge · AgentMart</div>
      </div>
      <div class="head-spacer"></div>
      <div class="status-dot" id="chat-status"><i></i><span id="chat-status-text">Ready</span></div>
    </div>

    <div class="chat-scroll" id="chat"></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Ask Hermes to find products, check stock, or place an order…"></textarea>
        <button id="send" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </section>

  <!-- RIGHT: Live A2A trace -->
  <section class="panel panel--trace">
    <div class="panel-head">
      <div>
        <div class="brand-title">A2A Trace</div>
        <div class="brand-sub">agentmart.a2a.v1 · live envelopes</div>
      </div>
      <div class="head-spacer"></div>
      <div class="status-dot" id="trace-status"><i></i><span>Idle</span></div>
    </div>

    <div class="trace-metrics">
      <div class="metric">
        <div class="m-label">Total tokens</div>
        <div class="m-value" id="total-tokens">0</div>
      </div>
      <div class="metric">
        <div class="m-label">Total elapsed</div>
        <div class="m-value" id="total-elapsed">0<small> ms</small></div>
      </div>
      <div class="metric">
        <div class="m-label">Envelopes</div>
        <div class="m-value" id="total-envelopes">0</div>
      </div>
    </div>

    <div class="trace-scroll" id="trace-scroll">
      <div class="trace-empty" id="trace-empty">
        <div class="big">◇</div>
        Send a message to watch the agents<br/>negotiate over the A2A bus.
      </div>
      <div id="runs" style="display:none"></div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var chat = document.getElementById("chat");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var runsEl = document.getElementById("runs");
  var timeline = null; // the current run's envelope tree; (re)created per run section
  var traceEmpty = document.getElementById("trace-empty");
  var traceScroll = document.getElementById("trace-scroll");
  var chatStatus = document.getElementById("chat-status");
  var chatStatusText = document.getElementById("chat-status-text");
  var traceStatus = document.getElementById("trace-status");

  var elTokens = document.getElementById("total-tokens");
  var elElapsed = document.getElementById("total-elapsed");
  var elEnvelopes = document.getElementById("total-envelopes");

  var STATE_LABEL = {
    proposed: "proposed", accepted: "accepted", in_progress: "in progress",
    completed: "completed", failed: "failed", input_required: "input required"
  };

  // The 5 AgentMart agents + payment, in a fixed display order regardless of
  // what order /agents reports them (or whether some haven't spoken yet).
  var LIVENESS_ORDER = [
    "shopping_agent", "pricing_agent", "inventory_agent",
    "fulfillment_agent", "order_agent", "payment_agent"
  ];
  var LIVENESS_LABEL = {
    shopping_agent: "Shopping", pricing_agent: "Pricing", inventory_agent: "Inventory",
    fulfillment_agent: "Fulfillment", order_agent: "Order", payment_agent: "Payment"
  };
  var livenessRow = document.getElementById("liveness-row");

  var totalTokens = 0, totalElapsed = 0, envCount = 0;
  var stepNo = 0, firstTs = null;
  var es = null;
  var busy = false;
  var replyRendered = false;
  var typingEl = null;
  var currentCid = null;

  // The Hermes/MyShopper orchestrator name used for every per-agent hop
  // (hermes_myshopper -> agent for the request, agent -> hermes_myshopper for
  // the response). Top-level framing envelopes (ACCEPTED/COMPLETED/FAILED) are
  // always agentmart -> hermes and never involve this name.
  var HERMES_MYSHOPPER = "hermes_myshopper";
  // agent name -> queue of open <div class="texchange"> groups awaiting their
  // response hop. FIFO per agent so parallel branches still pair correctly.
  var pendingByAgent = {};

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Minimal, safe markdown -> HTML for Hermes/assistant replies only. The raw
  // text is untrusted LLM output, so it is HTML-escaped FIRST via esc() and
  // every regex below only ever operates on that already-escaped string —
  // markdown punctuation (*, #, -, digits) survives esc() untouched, but a
  // literal "<" or "&" in the reply is already inert entities by the time any
  // tag gets built, so it can never inject real markup. This is intentionally
  // a small inline formatter (bold/italic, #/##/### headings, "-"/"1." lists,
  // paragraphs/line breaks) — not a full markdown parser, and not used for
  // anything but the Hermes chat bubble.
  function mdInline(s) {
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/(^|[^\w])_([^_]+)_(?![\w])/g, "$1<em>$2</em>");
    return s;
  }

  function mdToHtml(raw) {
    var text = esc(raw); // escape untrusted text before any tag is introduced
    var lines = text.split(/\r\n|\r|\n/);
    var out = [];
    var i = 0, n = lines.length;
    var reHeading = /^(#{1,6})\s+(.*)$/;
    var reBullet = /^\s*[-*]\s+/;
    var reNumbered = /^\s*\d+[.)]\s+/;

    while (i < n) {
      var line = lines[i];

      if (/^\s*$/.test(line)) { i++; continue; }

      var h = line.match(reHeading);
      if (h) {
        var level = h[1].length;
        out.push("<h" + level + ">" + mdInline(h[2].trim()) + "</h" + level + ">");
        i++;
        continue;
      }

      if (reBullet.test(line)) {
        var items = [];
        while (i < n && reBullet.test(lines[i])) {
          items.push("<li>" + mdInline(lines[i].replace(reBullet, "")) + "</li>");
          i++;
        }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }

      if (reNumbered.test(line)) {
        var oitems = [];
        while (i < n && reNumbered.test(lines[i])) {
          oitems.push("<li>" + mdInline(lines[i].replace(reNumbered, "")) + "</li>");
          i++;
        }
        out.push("<ol>" + oitems.join("") + "</ol>");
        continue;
      }

      var para = [];
      while (i < n && !/^\s*$/.test(lines[i]) && !reHeading.test(lines[i]) &&
             !reBullet.test(lines[i]) && !reNumbered.test(lines[i])) {
        para.push(mdInline(lines[i]));
        i++;
      }
      out.push("<p>" + para.join("<br>") + "</p>");
    }

    return out.join("") || "";
  }

  function scrollChat() { chat.scrollTop = chat.scrollHeight; }
  function scrollTrace() { traceScroll.scrollTop = traceScroll.scrollHeight; }

  function setChatStatus(text, cls) {
    chatStatusText.textContent = text;
    chatStatus.className = "status-dot" + (cls ? " " + cls : "");
  }
  function setTraceStatus(text, cls) {
    traceStatus.querySelector("span").textContent = text;
    traceStatus.className = "status-dot" + (cls ? " " + cls : "");
  }

  function addMessage(role, text) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;
    var avatar = role === "user" ? "You" : "H";
    // Only Hermes/assistant text is markdown-formatted; the user's own
    // messages are shown as plain (escaped) text, unchanged.
    var bodyHtml = (role === "hermes") ? mdToHtml(text) : esc(text);
    wrap.innerHTML =
      '<div class="avatar">' + esc(avatar) + '</div>' +
      '<div class="bubble">' + bodyHtml + '</div>';
    chat.appendChild(wrap);
    scrollChat();
    return wrap;
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "msg hermes";
    typingEl.innerHTML =
      '<div class="avatar">H</div>' +
      '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(typingEl);
    scrollChat();
  }
  function clearTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function badgeFor(state) {
    var color = getComputedStyle(document.documentElement)
      .getPropertyValue("--st-" + state) || "#7c86a0";
    var label = STATE_LABEL[state] || state || "unknown";
    return '<span class="badge" style="background:' + color.trim() + '">' + esc(label) + '</span>';
  }

  function num(n) {
    if (n == null || isNaN(n)) return null;
    return Number(n).toLocaleString();
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // Absolute wall-clock (HH:MM:SS) for a hop's created_at timestamp.
  function fmtClock(d) {
    if (!d || isNaN(d.getTime())) return "--:--:--";
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  // Seconds elapsed since the first envelope of this run, e.g. "+0.0s", "+2.3s".
  function fmtOffset(d) {
    if (!d || isNaN(d.getTime()) || firstTs == null) return "+0.0s";
    var secs = (d.getTime() - firstTs) / 1000;
    if (secs < 0) secs = 0;
    return "+" + secs.toFixed(1) + "s";
  }

  // Classify an envelope into where it belongs in the request/response hierarchy:
  //  "framing"  - top-level agentmart <-> hermes envelopes (ACCEPTED/COMPLETED/FAILED)
  //  "request"  - hermes_myshopper -> <agent> hop (the call)
  //  "response" - <agent> -> hermes_myshopper hop (the return)
  // Anything that doesn't match either shape falls back to "framing" so it still
  // renders (at the base indent) instead of being dropped.
  function classifyEnvelope(env) {
    var sender = env.sender || "", recipient = env.recipient || "";
    if (sender === HERMES_MYSHOPPER && recipient !== HERMES_MYSHOPPER) return "request";
    if (recipient === HERMES_MYSHOPPER && sender !== HERMES_MYSHOPPER) return "response";
    return "framing";
  }

  // Pretty-print a value for the drill-down JSON block; falls back to a plain
  // string if it isn't JSON-serializable for some reason.
  function prettyJson(value) {
    try { return JSON.stringify(value === undefined ? null : value, null, 2); }
    catch (err) { return String(value); }
  }

  function fieldRow(key, value) {
    var shown = (value == null || value === "") ? "—" : value;
    return '<div class="tdetail-key">' + esc(key) + '</div>' +
      '<div class="tdetail-val">' + esc(shown) + '</div>';
  }

  // Full field set + pretty-printed payload for the expandable drill-down area.
  function buildDetailHtml(env) {
    var metrics = env.metrics && Object.keys(env.metrics).length ? prettyJson(env.metrics) : "—";
    return (
      '<div class="tdetail" hidden>' +
        '<div class="tdetail-fields">' +
          fieldRow("correlation_id", env.correlation_id) +
          fieldRow("task_id", env.task_id) +
          fieldRow("state", env.state) +
          fieldRow("intent", env.intent) +
          '<div class="tdetail-key">metrics</div>' +
          '<div class="tdetail-val"><code>' + esc(metrics) + '</code></div>' +
        '</div>' +
        '<pre class="tdetail-json">' + esc(prettyJson(env.payload)) + '</pre>' +
      '</div>'
    );
  }

  // Wire up click + keyboard toggling for one card's drill-down area.
  function wireExpand(cardEl) {
    var header = cardEl.querySelector(".tcard-top");
    var detail = cardEl.querySelector(".tdetail");
    var chev = header.querySelector(".chev");
    function toggle() {
      var opening = detail.hasAttribute("hidden");
      if (opening) { detail.removeAttribute("hidden"); } else { detail.setAttribute("hidden", ""); }
      header.setAttribute("aria-expanded", opening ? "true" : "false");
      if (chev) chev.classList.toggle("open", opening);
    }
    header.addEventListener("click", toggle);
    header.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        toggle();
      }
    });
  }

  // Build one envelope's card (route, badge, intent, metrics, meta, drill-down),
  // wrapped in a "tnode" (base level) or "thop" (nested request/response) element.
  function buildEnvelopeCard(env, kind) {
    var state = env.state || "proposed";
    var dot = (getComputedStyle(document.documentElement)
      .getPropertyValue("--st-" + state) || "#7c86a0").trim();
    var m = env.metrics || {};
    var sender = env.sender || "?";
    var recipient = env.recipient || "?";

    // Step number and timing relative to the first envelope in this run.
    stepNo += 1;
    var ts = env.created_at ? new Date(env.created_at) : null;
    if (ts && !isNaN(ts.getTime()) && firstTs == null) firstTs = ts.getTime();
    var metaHtml =
      '<div class="tmeta">' +
        '<span class="step">#' + stepNo + '</span>' +
        '<span class="sep">·</span>' +
        '<span class="clock">' + esc(fmtClock(ts)) + '</span>' +
        '<span class="sep">·</span>' +
        '<span class="offset">' + esc(fmtOffset(ts)) + '</span>' +
      '</div>';

    var metricsHtml;
    var hasMetrics = m && (m.total_tokens != null || m.elapsed_ms != null ||
      m.prompt_tokens != null || m.completion_tokens != null);
    if (hasMetrics) {
      var parts = [];
      if (m.prompt_tokens != null) parts.push('<span>in <b>' + num(m.prompt_tokens) + '</b></span>');
      if (m.completion_tokens != null) parts.push('<span>out <b>' + num(m.completion_tokens) + '</b></span>');
      if (m.total_tokens != null) parts.push('<span>tok <b>' + num(m.total_tokens) + '</b></span>');
      if (m.elapsed_ms != null) parts.push('<span><b>' + num(m.elapsed_ms) + '</b> ms</span>');
      metricsHtml = '<div class="tmetrics">' + parts.join("") + '</div>';
    } else {
      metricsHtml = '<div class="tmetrics"><span class="none">— no metrics —</span></div>';
    }

    var node = document.createElement("div");
    node.className = (kind === "framing") ? "tnode" : ("thop thop--" + kind);
    node.style.setProperty("--dot", dot);
    node.innerHTML =
      '<div class="tcard">' +
        '<div class="tcard-top" tabindex="0" role="button" aria-expanded="false">' +
          '<span class="chev" aria-hidden="true">▸</span>' +
          '<span class="route">' + esc(sender) + '<span class="arrow">→</span>' + esc(recipient) + '</span>' +
          badgeFor(state) +
        '</div>' +
        (env.intent ? '<span class="intent">' + esc(env.intent) + '</span>' : '') +
        metricsHtml +
        metaHtml +
        buildDetailHtml(env) +
      '</div>';
    wireExpand(node);

    // running totals
    envCount += 1;
    if (m && m.total_tokens != null && !isNaN(m.total_tokens)) totalTokens += Number(m.total_tokens);
    if (m && m.elapsed_ms != null && !isNaN(m.elapsed_ms)) totalElapsed += Number(m.elapsed_ms);
    elTokens.textContent = num(totalTokens);
    elElapsed.innerHTML = num(totalElapsed) + '<small> ms</small>';
    elEnvelopes.textContent = num(envCount);

    return node;
  }

  // Render one envelope into the timeline: base level for framing envelopes,
  // or nested one level under a per-agent exchange group for request/response
  // hops, pairing the response under its request by agent name (FIFO per
  // agent). A response with no pending request (e.g. it arrives out of order)
  // still renders on its own rather than being dropped.
  function addTraceNode(env) {
    // `timeline` is the current run's own tree (see startRunSection); it is
    // always freshly created and visible, so there's no display toggle here.
    var kind = classifyEnvelope(env);
    var card = buildEnvelopeCard(env, kind);

    if (kind === "request") {
      var group = document.createElement("div");
      group.className = "texchange";
      group.appendChild(card);
      timeline.appendChild(group);
      var agent = env.recipient || "";
      (pendingByAgent[agent] = pendingByAgent[agent] || []).push(group);
    } else if (kind === "response") {
      var agentName = env.sender || "";
      var queue = pendingByAgent[agentName];
      var target;
      if (queue && queue.length) {
        target = queue.shift();
      } else {
        target = document.createElement("div");
        target.className = "texchange texchange--orphan";
        timeline.appendChild(target);
      }
      target.appendChild(card);
    } else {
      timeline.appendChild(card);
    }

    scrollTrace();
  }

  function addApprovalCard(env) {
    clearTyping();
    var payload = env.payload || {};
    // The worker's checkout gate emits payload.prompt (e.g. "Confirm purchase
    // of $92.50?"); summary/text/reply are kept as fallbacks for other
    // input_required producers.
    var summary = payload.summary || payload.text || payload.prompt || payload.reply ||
      "Hermes needs your confirmation before proceeding with this action.";
    var taskId = env.task_id;

    var wrap = document.createElement("div");
    wrap.className = "msg hermes";
    wrap.innerHTML =
      '<div class="avatar">H</div>' +
      '<div class="bubble">' +
        '<div class="approval">' +
          '<div class="a-title">Confirmation required</div>' +
          '<div class="a-body">' + mdToHtml(summary) + '</div>' +
          '<div class="a-btns">' +
            '<button class="btn approve">Approve</button>' +
            '<button class="btn decline">Decline</button>' +
          '</div>' +
          '<div class="a-result" style="display:none"></div>' +
        '</div>' +
      '</div>';
    chat.appendChild(wrap);
    scrollChat();

    var card = wrap.querySelector(".approval");
    var approveBtn = wrap.querySelector(".approve");
    var declineBtn = wrap.querySelector(".decline");
    var result = wrap.querySelector(".a-result");

    function resolve(approved) {
      approveBtn.disabled = true;
      declineBtn.disabled = true;
      card.classList.add("resolved");
      result.style.display = "block";
      result.style.color = approved ? "var(--st-completed)" : "var(--st-failed)";
      result.textContent = approved ? "✓ Approved — completing your order…" : "✕ Declined";
      postConfirm(currentCid, taskId, approved);
      if (approved) { setChatStatus("Working…", "busy"); showTyping(); }
    }
    approveBtn.addEventListener("click", function () { resolve(true); });
    declineBtn.addEventListener("click", function () { resolve(false); });
  }

  function postConfirm(cid, taskId, approved) {
    fetch("/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cid: cid, task_id: taskId, approved: approved })
    }).catch(function () {});
  }

  function handleEnvelope(env) {
    addTraceNode(env);
    setTraceStatus("Streaming", "busy");

    var state = env.state;
    if (state === "input_required") {
      addApprovalCard(env);
      setChatStatus("Awaiting your approval", "busy");
      return;
    }

    // Only the TERMINAL framing envelope (sender "agentmart") carries the real
    // customer-facing reply. Per-agent hops reuse the same completed/failed
    // lifecycle states for their own sub-task (e.g. order_agent -> hermes_myshopper)
    // but never carry a transcript -- rendering those as a chat bubble is what
    // produced the "AgentMart has completed your request." placeholder. Those
    // hops are still shown in the trace (via addTraceNode above) but never here.
    if (env.sender !== "agentmart" || (state !== "completed" && state !== "failed")) {
      return;
    }

    if (state === "completed") {
      if (!replyRendered) {
        clearTyping();
        var reply = (env.payload || {}).reply;
        var text = (typeof reply === "string" && reply.trim())
          ? reply
          : "Done — AgentMart has completed your request.";
        addMessage("hermes", text);
        replyRendered = true;
      }
      return;
    }
    if (state === "failed") {
      clearTyping();
      var msg = (env.payload || {}).error || (env.payload || {}).reply ||
        "Sorry — something went wrong while handling that request.";
      addMessage("hermes", msg);
    }
  }

  function finishStream() {
    if (es) { es.close(); es = null; }
    clearTyping();
    busy = false;
    sendBtn.disabled = false;
    input.disabled = false;
    setChatStatus("Ready", "live");
    setTraceStatus("Complete", "live");
  }

  // Start a new trace section for one customer message: a header with that
  // message's text, followed by its own indented request/response tree
  // underneath. Sections accumulate for the session (most recent at the
  // bottom, matching the chat panel's order) instead of replacing each
  // other, so earlier runs stay visible and scrollable above the latest one.
  // Only the per-run pairing/timing state resets here — the header totals
  // (tokens/elapsed/envelopes) keep accumulating across the whole session,
  // since multiple runs' envelopes are now all visible at once.
  function startRunSection(userText) {
    stepNo = 0;
    firstTs = null;
    pendingByAgent = {};

    traceEmpty.style.display = "none";
    runsEl.style.display = "block";

    var section = document.createElement("div");
    section.className = "trun";
    section.innerHTML =
      '<div class="trun-head">' +
        '<span class="trun-quote" aria-hidden="true">&ldquo;</span>' +
        '<div class="trun-body">' +
          '<div class="trun-label">Customer message</div>' +
          '<div class="trun-msg"></div>' +
        '</div>' +
      '</div>' +
      '<div class="timeline"></div>';
    section.querySelector(".trun-msg").textContent = userText || "(no text)";
    runsEl.appendChild(section);

    timeline = section.querySelector(".timeline");
  }

  function openStream(cid, userText) {
    currentCid = cid;
    replyRendered = false;
    startRunSection(userText);
    es = new EventSource("/events/" + encodeURIComponent(cid));

    es.onmessage = function (e) {
      if (!e.data) return;
      var env;
      try { env = JSON.parse(e.data); } catch (err) { return; }
      if (env && Object.keys(env).length) handleEnvelope(env);
    };
    es.addEventListener("done", finishStream);
    es.onerror = function () {
      // stream ended (server closed) or connection error
      finishStream();
    };
  }

  function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    addMessage("user", text);
    input.value = "";
    autosize();
    sendBtn.disabled = true;
    input.disabled = true;
    setChatStatus("Working…", "busy");
    setTraceStatus("Connecting", "busy");
    showTyping();

    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, customer_id: "CUST-1001" })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.correlation_id) {
          openStream(data.correlation_id, text);
        } else {
          throw new Error("no correlation_id");
        }
      })
      .catch(function () {
        clearTyping();
        addMessage("hermes", "I couldn't reach the service. Please try again.");
        finishStream();
      });
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
  }

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    // Enter submits; Shift+Enter inserts a newline. Ignore Enter while an
    // IME composition is active (e.key can be "Process"/keyCode 229 then).
    var isEnter = e.key === "Enter" || e.keyCode === 13;
    if (isEnter && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener("click", send);

  // ---------- Agent liveness polling ----------
  // Renders one dot per known agent, refreshed from GET /agents. Purely
  // additive/decorative: a failed fetch just leaves the row as-is (or
  // "unknown" on first load) rather than disrupting chat or trace.
  function renderLiveness(snapshot) {
    var items = LIVENESS_ORDER.map(function (agent) {
      var status = (snapshot && snapshot[agent]) || "unknown";
      return '<span class="liveness-item ' + status + '">' +
        '<span class="dot"></span>' + esc(LIVENESS_LABEL[agent] || agent) +
        '</span>';
    });
    livenessRow.innerHTML = '<span class="liveness-label">Agents</span>' + items.join("");
  }

  function pollLiveness() {
    fetch("/agents")
      .then(function (r) { return r.json(); })
      .then(renderLiveness)
      .catch(function () {}); // stay quiet; row simply keeps its last known state
  }

  renderLiveness(null);
  pollLiveness();
  setInterval(pollLiveness, 4000);

  // greeting
  addMessage("hermes", "Hi, I'm Hermes — your MyShopper concierge. Tell me what you're looking for and I'll coordinate with AgentMart to find it. Try: “find wireless earbuds under $120”.");
  setChatStatus("Ready", "live");
  input.focus();
})();
</script>
</body>
</html>
